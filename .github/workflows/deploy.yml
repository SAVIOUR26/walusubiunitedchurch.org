name: Deploy to FTP Server

on:
  push:
    branches:
      - main
      - claude/ecstatic-heisenberg-G3kjd   # also deploy from this branch during development

jobs:
  deploy:
    name: Upload to walusubiunitedchurch.online via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            *.md
            *.docx
            *.pdf
            "WALUSUBI - Church Profile.pdf"
            "Website Structure for walusubiunitedchurch.docx"
          log-level: standard
          dangerous-clean-slate: false
